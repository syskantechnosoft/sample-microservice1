name: CI-CD-Microservices

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/simple-ms

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build All Microservices Using Maven
        run: mvn -B clean package -DskipTests

      # ----------------------------------------------------
      # CUSTOMER-SERVICE
      # ----------------------------------------------------
      - name: Build customer-service Image
        run: |
          docker build -t $IMAGE_PREFIX-customer-service:latest ./customer-service
          docker push $IMAGE_PREFIX-customer-service:latest

      # ----------------------------------------------------
      # ACCOUNT-SERVICE
      # ----------------------------------------------------
      - name: Build account-service Image
        run: |
          docker build -t $IMAGE_PREFIX-account-service:latest ./account-service
          docker push $IMAGE_PREFIX-account-service:latest

      # ----------------------------------------------------
      # LOAN-SERVICE
      # ----------------------------------------------------
      - name: Build loan-service Image
        run: |
          docker build -t $IMAGE_PREFIX-loan-service:latest ./loan-service
          docker push $IMAGE_PREFIX-loan-service:latest

      # ----------------------------------------------------
      # CONFIG-SERVER (native profile)
      # ----------------------------------------------------
      - name: Build config-server Image
        run: |
          docker build -t $IMAGE_PREFIX-config-server:latest ./config-server
          docker push $IMAGE_PREFIX-config-server:latest

      # ----------------------------------------------------
      # EUREKA
      # ----------------------------------------------------
      - name: Build eureka-server Image
        run: |
          docker build -t $IMAGE_PREFIX-eureka-server:latest ./eureka-server
          docker push $IMAGE_PREFIX-eureka-server:latest

      # ----------------------------------------------------
      # API-GATEWAY (JWT Auth)
      # ----------------------------------------------------
      - name: Build api-gateway Image
        run: |
          docker build -t $IMAGE_PREFIX-api-gateway:latest ./api-gateway
          docker push $IMAGE_PREFIX-api-gateway:latest

      # ----------------------------------------------------
      # FRONTEND (React + Vite)
      # ----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build frontend Image
        run: |
          docker build -t $IMAGE_PREFIX-frontend:latest ./frontend
          docker push $IMAGE_PREFIX-frontend:latest

  # ========================================================
  # DEPLOY TO KUBERNETES USING HELM
  # ========================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to Kubernetes Cluster
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy Using Helm
        run: |
          helm upgrade --install simple-microservices ./helm \
            --namespace simple-ms \
            --create-namespace \
            --set customerService.image=$IMAGE_PREFIX-customer-service:latest \
            --set accountService.image=$IMAGE_PREFIX-account-service:latest \
            --set loanService.image=$IMAGE_PREFIX-loan-service:latest \
            --set configServer.image=$IMAGE_PREFIX-config-server:latest \
            --set eurekaServer.image=$IMAGE_PREFIX-eureka-server:latest \
            --set apiGateway.image=$IMAGE_PREFIX-api-gateway:latest \
            --set frontend.image=$IMAGE_PREFIX-frontend:latest
