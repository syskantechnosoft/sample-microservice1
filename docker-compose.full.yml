version: '3.8'

services:
  # Infrastructure
  mysql:
    image: mysql:8.0
    container_name: banking-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banking_customer_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: --default-authentication-plugin=mysql_native_password

  mongodb:
    image: mongo:6.0
    container_name: banking-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  # Backend Services
  config-server:
    build: ./config-server
    container_name: banking-config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-data:/app/config-data

  discovery-server:
    build: ./discovery-server
    container_name: banking-discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888

  api-gateway:
    build: ./api-gateway
    container_name: banking-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - discovery-server
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761

  customer-service:
    build: ./customer-service
    container_name: banking-customer-service
    depends_on:
      - mysql
      - config-server
      - discovery-server
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761
      - DB_HOST=mysql
      - DB_PORT=3306

  account-service:
    build: ./account-service
    container_name: banking-account-service
    depends_on:
      - mysql
      - config-server
      - discovery-server
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761
      - DB_HOST=mysql
      - DB_PORT=3306

  loan-service:
    build: ./loan-service
    container_name: banking-loan-service
    depends_on:
      - mongodb
      - config-server
      - discovery-server
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://discovery-server:8761
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017

  # Frontend
  frontend:
    build: ./frontend
    container_name: banking-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  mongo_data: