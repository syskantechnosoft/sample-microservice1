apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.registry }}/api-gateway:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.services.api-gateway.port }}
          env:
            - name: EUREKA_SERVER
              value: "http://eureka-server"
            - name: CONFIG_SERVER
              value: "http://config-server"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: {{ .Values.services.api-gateway.port }}
  type: LoadBalancer
