apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: "{{ .Values.registry }}/eureka-server:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.services.eureka.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  selector:
    app: eureka-server
  ports:
    - port: 80
      targetPort: {{ .Values.services.eureka.port }}
